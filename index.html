<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>開卦小廢物</title>
  
  <!-- 引入開源的曆法套件：自動精算當日節氣與地支月令 -->
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
  <!-- 引入 html2canvas 套件：用於將 HTML 轉換為圖片 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 10px;
      margin: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 20px 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    h2 { text-align: center; color: #2c3e50; margin-top: 0; font-size: 22px; }
    .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
    .input-group { flex: 1; min-width: 110px; display: flex; flex-direction: column; }
    
    /* 讓問題輸入框獨佔一行 */
    .full-width { flex: 1 1 100%; }
    
    label { font-size: 16px; margin-bottom: 8px; color: #555; font-weight: bold; }
    
    input[type="number"], input[type="text"], select {
      width: 100%; box-sizing: border-box; padding: 12px;
      border: 1px solid #c0c6cc; border-radius: 8px; font-size: 18px;
      text-align: center; background-color: #fafbfc;
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #4a6fa5;
      background-color: #fff;
    }
    
    button {
      width: 100%; padding: 15px; background-color: #4a6fa5; color: white;
      border: none; border-radius: 8px; font-size: 18px; cursor: pointer;
      font-weight: bold; transition: background-color 0.3s;
      box-shadow: 0 2px 5px rgba(74, 111, 165, 0.3);
    }
    button:hover { background-color: #3b5a86; }
    
    /* 下載按鈕的獨立樣式 */
    .btn-download { background-color: #27ae60; margin-top: 20px; }
    .btn-download:hover { background-color: #219653; }
    
    .result-area { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #e1e4e8; display: none; }
    
    /* 為了確保截圖時背景是白色的，給要截圖的區塊加上白色背景和 padding */
    .capture-area { background-color: #ffffff; padding: 15px; border-radius: 8px; }
    
    .layout-wrapper { display: flex; flex-direction: column; gap: 30px; margin-bottom: 20px; }
    .gua-panel { width: 100%; }
    .wuxing-panel { width: 100%; padding-top: 20px; border-top: 2px dashed #eee; }

    /* 五行方塊樣式 */
    .wx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 8px; justify-items: center; align-items: start; }
    .wx-item { display: flex; flex-direction: column; align-items: center; }
    .wx-box { width: 65px; height: 65px; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: #fff; }
    .wx-char { font-size: 30px; font-weight: bold; }
    .wx-count { position: absolute; top: -22px; left: -5px; font-weight: bold; font-size: 16px; color: #333; }
    .wx-label-top { position: absolute; font-size: 14px; text-align: center; white-space: nowrap; color: #333; font-weight: bold; top: -22px; width: 100%; }
    .wx-label-bottom { font-size: 14px; color: #333; font-weight: bold; margin-top: 6px; margin-bottom: 4px; text-align: center; }
    .wx-sources { text-align: center; }
    .wx-source-line { font-size: 14px; color: #555; margin-bottom: 3px; white-space: nowrap; line-height: 1.3; font-weight: bold; }

    /* 顏色區分 */
    .wx-color-火 { color: #d32f2f; }
    .wx-color-土 { color: #8d6e63; }
    .wx-color-金 { color: #fbc02d; }
    .wx-color-水 { color: #1976d2; }
    .wx-color-木 { color: #388e3c; }

    /* 統一對齊的 6 欄網格 (自動處理 變卦、互卦、本卦 的對齊) */
    .gua-grid { 
      display: grid; 
      grid-template-columns: repeat(6, 1fr); 
      gap: 8px; 
      text-align: center; 
      margin-bottom: 20px; 
    }
    .gua-grid .box { 
      background: #fff; 
      border: 2px solid #e1e4e8; 
      border-radius: 8px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start; 
      box-sizing: border-box; 
    }
    /* 佔兩欄的方塊 (變卦、互卦、本卦、變) */
    .gua-grid .box-2col { grid-column: span 2; padding: 12px 4px; }
    /* 佔一欄的方塊 (互用、互體、用、體) */
    .gua-grid .box-1col { grid-column: span 1; padding: 12px 2px; }
    
    .gua-grid .box-title { font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 8px; font-size: 14px; width: 90%; color: #666;}
    .gua-grid .box-symbol { font-size: 52px; line-height: 1.1; margin: 5px 0; color: #34495e; }
    .gua-grid .box-value { font-size: 18px; font-weight: 900; color: #111; } /* 最高級別加粗 */
    .gua-grid .box-meaning { font-size: 15px; color: #222; margin-top: 6px; line-height: 1.4; padding: 0 2px; font-weight: bold; }
    .gua-grid .box-item { margin-bottom: 4px; font-size: 16px; font-weight: 900; color: #111; } /* 最高級別加粗 */
    .gua-grid .box-cs { margin-top: auto; padding-top: 8px; font-size: 17px; font-weight: 900; color: #d35400; }
    
    /* 這裡已將字體改回正常粗細 (normal) */
    .gua-grid .box-num { font-size: 16px; font-weight: normal; color: #111; margin-top: 4px; }

    .highlight { color: #d35400; font-weight: bold; font-size: 20px; }

    /* 底部內心卦樣式 */
    .neixin-area { display: flex; justify-content: space-around; border-top: 2px dashed #eee; padding-top: 20px; margin-top: 10px; font-size: 16px; font-weight: bold; color: #333; }
    
    /* 手機長按預覽圖遮罩樣式 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .modal-tip { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; }
    .modal-img { max-width: 90%; max-height: 80vh; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div class="container">
    <h2>開卦小廢物-超方便版</h2>
    <div class="form-row">
      <!-- 測問事項 -->
      <div class="input-group full-width">
        <label>測問事項</label>
        <input type="text" id="question" placeholder="請輸入問題">
      </div>
      
      <div class="input-group">
        <label>月令(地支)</label>
        <select id="month" required>
          <option value="1">1月 (寅)</option>
          <option value="2">2月 (卯)</option>
          <option value="3">3月 (辰)</option>
          <option value="4">4月 (巳)</option>
          <option value="5">5月 (午)</option>
          <option value="6">6月 (未)</option>
          <option value="7">7月 (申)</option>
          <option value="8">8月 (酉)</option>
          <option value="9">9月 (戌)</option>
          <option value="10">10月 (亥)</option>
          <option value="11">11月 (子)</option>
          <option value="12">12月 (丑)</option>
        </select>
      </div>
      <div class="input-group"><label>第1把</label><input type="number" id="num1" required></div>
      <div class="input-group"><label>第2把</label><input type="number" id="num2" required></div>
      <div class="input-group"><label>第3把</label><input type="number" id="num3" required></div>
      <div class="input-group">
        <label>時間數</label>
        <select id="time" required>
         <option value="" disabled selected>時辰</option>
          <option value="1">子 23:00-00:59</option><option value="2">丑 01:00-02:59</option>
          <option value="3">寅 03:00-04:59</option><option value="4">卯 05:00-06:59</option>
          <option value="5">辰 07:00-08:59</option><option value="6">巳 09:00-10:59</option>
          <option value="7">午 11:00-12:59</option><option value="8">未 13:00-14:59</option>
          <option value="9">申 15:00-16:59</option><option value="10">酉 17:00-18:59</option>
          <option value="11">戌 19:00-20:59</option><option value="12">亥 21:00-22:59</option>
        </select>
      </div>
    </div>
    
    <button id="btnSubmit" onclick="runCalculation()">開始排卦</button>

    <div id="resultArea" class="result-area">
      <div id="captureTarget" class="capture-area">
        
        <div id="resQuestionArea" style="text-align: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #e1e4e8; display: none;">
          <span style="font-size: 20px; font-weight: bold; color: #333;">問題：</span>
          <span id="resQuestion" style="font-size: 20px; font-weight: bold; color: #1976d2;"></span>
        </div>

        <div style="text-align: center; margin-bottom: 20px; display: flex; justify-content: center; flex-wrap: wrap; gap: 15px;">
          <div>
            <span style="font-size: 18px; font-weight: bold; color: #555;">貴人：</span>
            <span id="resGuiRen" class="highlight"></span>
          </div>
          <div>
            <span style="font-size: 18px; font-weight: bold; color: #555;">卦氣合化：</span>
            <span id="resGuaQi" class="highlight"></span>
          </div>
        </div>

        <div class="layout-wrapper">
          <div class="gua-panel">
            <!-- 統一網格區 -->
            <div class="gua-grid" id="unifiedGuaArea"></div>
          </div>

          <div class="wuxing-panel">
            <div style="text-align: center; color: #666; font-size: 15px; font-weight: bold; margin-bottom: 25px;">【 五行能量與卦名分佈 】</div>
            <div class="wx-grid" id="wxGridArea"></div>
          </div>
        </div>
        
        <div class="neixin-area">
          <div>內心(體)： <span id="resNeiXinTi" ></span></div>
          <div>內心(用)： <span id="resNeiXinYong"></span></div>
        </div>
      </div>
      <button id="btnDownload" class="btn-download" onclick="downloadImage()">⬇️ 下載截圖</button>
    </div>
  </div>

        const autoMonthNum = zhiToMonth[autoMonthZhi];
        
        const monthSelect = document.getElementById('month');
        const autoOption = document.createElement('option');
        autoOption.value = autoMonthNum;
        autoOption.selected = true;
        autoOption.text = `[自動] ${autoMonthNum}月(${autoMonthZhi})`;

      '地火明夷': { strong: '太陽沒入地底下，黑暗來臨', weak: '太陽沒入地底下，黑暗來臨' },
      '地雷復': { strong: '同一件事一直反覆發生', weak: '同一件事一直反覆發生' },
      '地風升': { strong: '上升', weak: '上升' },
      '地水師': { strong: '勞師動眾，一群人為此事忙', weak: '勞師動眾，一群人為此事忙' },
      '地山謙': { strong: '謙虛-擺低姿態換取劣勢下存活機會', weak: '謙虛-擺低姿態換取劣勢下存活機會' },
      '坤為地': { strong: '包容，吞忍', weak: '包容，吞忍' }
    };

    // --- 十二長生對照表 ---
    const changshengTable = {
      '乾': ['絕', '胎', '養', '長生', '沐浴', '冠帶', '臨官', '帝旺', '衰', '病', '死', '墓'],
      '兌': ['胎', '絕', '墓', '死', '病', '衰', '帝旺', '臨官', '冠帶', '沐浴', '長生', '養'],
      '離_上': ['長生', '沐浴', '冠帶', '臨官', '帝旺', '衰', '病', '死', '墓', '絕', '胎', '養'],
      '離_下': ['死', '病', '衰', '帝旺', '臨官', '冠帶', '沐浴', '長生', '養', '胎', '絕', '墓'],
      '震': ['臨官', '帝旺', '衰', '病', '死', '墓', '絕', '胎', '養', '長生', '沐浴', '冠帶'],
      '巽': ['帝旺', '臨官', '冠帶', '沐浴', '長生', '養', '胎', '絕', '墓', '死', '病', '衰'],
      '坎_上': ['病', '死', '墓', '絕', '胎', '養', '長生', '沐浴', '冠帶', '臨官', '帝旺', '衰'],
      '坎_下': ['沐浴', '長生', '養', '胎', '絕', '墓', '死', '病', '衰', '帝旺', '臨官', '冠帶'],
      '艮': ['長生', '沐浴', '冠帶', '臨官', '帝旺', '衰', '病', '死', '墓', '絕', '胎', '養'],
      '坤': ['死', '病', '衰', '帝旺', '臨官', '冠帶', '沐浴', '長生', '養', '胎', '絕', '墓']
    };

    // --- 八卦對應數字 ---
    const guaNumbers = {
      '乾': '1649',
      '兌': '2749',
      '離': '3927',
      '震': '4338',
      '巽': '5438',
      '坎': '6116',
      '艮': '7850',
      '坤': '8250'
    };

    function getCsKey(guaName, pos) {
      if (guaName === '坎' || guaName === '離') return guaName + '_' + (pos === 'upper' ? '上' : '下');
      return guaName;
    }

    const shengMap = {'金':'水', '水':'木', '木':'火', '火':'土', '土':'金'};
    const keMap = {'金':'木', '木':'土', '土':'水', '水':'火', '火':'金'};
    const wxColors = { '火': '#d32f2f', '土': '#8d6e63', '金': '#fbc02d', '水': '#1976d2', '木': '#388e3c' };
    
    function getShortRelation(tiWx, targetWx, isTiGua) {
      if (isTiGua) return { text: "自己", sym: "○" };
      if (tiWx === targetWx) return { text: "同我", sym: "○" };
      if (shengMap[targetWx] === tiWx) return { text: "生我", sym: "○" };
      if (shengMap[tiWx] === targetWx) return { text: "我洩", sym: "△" }; 
      if (keMap[tiWx] === targetWx) return { text: "我剋", sym: "△" };
      if (keMap[targetWx] === tiWx) return { text: "剋我", sym: "×" };
      return { text: "未知", sym: "" };
    }

    function runCalculation() {
      const questionText = document.getElementById('question').value.trim();
      const month = parseInt(document.getElementById('month').value);
      const num1 = parseInt(document.getElementById('num1').value);
      const num2 = parseInt(document.getElementById('num2').value);
      const num3 = parseInt(document.getElementById('num3').value);
      const time = parseInt(document.getElementById('time').value);

      if(!month || !num1 || !num2 || !num3 || !time) {
        alert("請輸入完整的資料");
        return;
      }
      
      let guaQi = "";
      if (month === 1 || month === 10) guaQi = "木";
      else if (month === 2 || month === 9 || month === 5 || month === 6) guaQi = "火";
      else if (month === 11 || month === 12) guaQi = "土";
      else if (month === 3 || month === 8) guaQi = "金";
      else if (month === 4 || month === 7) guaQi = "水";
      
      let upperIdx = num1 % 8 || 8;
      let lowerIdx = (num2 + num3) % 8 || 8;
      let movingYao = (num1 + num2 + num3 + time) % 6 || 6;

      const upperGua = trigrams[upperIdx];
      const lowerGua = trigrams[lowerIdx];

      let yaosArr = (lowerGua.bits + upperGua.bits).split('');
      let bianYaosArr = [...yaosArr];
      let mIndex = movingYao - 1; 
      bianYaosArr[mIndex] = bianYaosArr[mIndex] === '1' ? '0' : '1';
      let bianLowerBits = bianYaosArr[0] + bianYaosArr[1] + bianYaosArr[2];
      let bianUpperBits = bianYaosArr[3] + bianYaosArr[4] + bianYaosArr[5];
      const bianLowerGua = trigrams[bitsMap[bianLowerBits]];
      const bianUpperGua = trigrams[bitsMap[bianUpperBits]];

      let benGuaStr = yaosArr.join('');
      let sourceYaosArr = (benGuaStr === '111111' || benGuaStr === '000000') ? bianYaosArr : yaosArr;
      const huLowerGua = trigrams[bitsMap[sourceYaosArr.slice(1,4).join('')]];
      const huUpperGua = trigrams[bitsMap[sourceYaosArr.slice(2,5).join('')]];

      let tiGua, yongGua, huTiGua, huYongGua, bianTransformed;
      let tiPos, yongPos, huTiPos, huYongPos, bianPos;

      if (movingYao <= 3) {
        tiGua = upperGua;          tiPos = 'upper';
        yongGua = lowerGua;        yongPos = 'lower';
        huTiGua = huUpperGua;      huTiPos = 'upper';
        huYongGua = huLowerGua;    huYongPos = 'lower';
        bianTransformed = bianLowerGua; bianPos = 'lower';
      } else {
        tiGua = lowerGua;          tiPos = 'lower';
        yongGua = upperGua;        yongPos = 'upper';
        huTiGua = huLowerGua;      huTiPos = 'lower';
        huYongGua = huUpperGua;    huYongPos = 'upper';
        bianTransformed = bianUpperGua; bianPos = 'upper';
      }

      const benGuaName = hexagramNames[upperGua.name + lowerGua.name];
      const huGuaName = hexagramNames[huUpperGua.name + huLowerGua.name];
      const bianGuaName = hexagramNames[bianUpperGua.name + bianLowerGua.name];
      
      let cuoYaosArr = yaosArr.map(b => b === '1' ? '0' : '1');
      const cuoLowerGua = trigrams[bitsMap[cuoYaosArr.slice(0,3).join('')]];
      const cuoUpperGua = trigrams[bitsMap[cuoYaosArr.slice(3,6).join('')]];
      const neiXinTiName = hexagramNames[cuoUpperGua.name + cuoLowerGua.name];

      let zongYaosArr = [...yaosArr].reverse();
      const zongLowerGua = trigrams[bitsMap[zongYaosArr.slice(0,3).join('')]];
      const zongUpperGua = trigrams[bitsMap[zongYaosArr.slice(3,6).join('')]];
      const neiXinYongName = hexagramNames[zongUpperGua.name + zongLowerGua.name];
      
      const guaSourcesAll = [
        { id: '體', tri: tiGua, hex: benGuaName, show: false }, 
        { id: '1', tri: yongGua, hex: benGuaName, show: true }, 
        { id: '2', tri: huTiGua, hex: huGuaName, show: true },  
        { id: '3', tri: huYongGua, hex: huGuaName, show: true },
        { id: '4', tri: bianTransformed, hex: bianGuaName, show: true } 
      ];

      const elementsArray = [tiGua.wx, yongGua.wx, huTiGua.wx, huYongGua.wx, bianTransformed.wx];
      const wxCounts = { '金': 0, '木': 0, '水': 0, '火': 0, '土': 0 };
      elementsArray.forEach(wx => wxCounts[wx]++);

      const myWx = tiGua.wx;              
      const shengMyWx = Object.keys(shengMap).find(k => shengMap[k] === myWx); 
      const strengthCount = wxCounts[myWx] + wxCounts[shengMyWx];

      let bodyStatus = "";
      let guiRen = "";

      if (strengthCount >= 3) {
        bodyStatus = "身強";
        const generateCycle = ['木', '火', '土', '金', '水'];
        let startIndex = generateCycle.indexOf(myWx);
        for (let i = 1; i <= 4; i++) {
          let checkWx = generateCycle[(startIndex + i) % 5];
          if (wxCounts[checkWx] === 0) { guiRen = checkWx; break; }
        }
      } else {
        bodyStatus = "身弱";
        guiRen = shengMyWx;
      }

      document.getElementById('resultArea').style.display = 'block';
      
      if (questionText) {
        document.getElementById('resQuestion').innerText = questionText;
        document.getElementById('resQuestionArea').style.display = 'block';
      } else {
        document.getElementById('resQuestionArea').style.display = 'none';
      }

      document.getElementById('resGuiRen').innerText = `${guiRen} (${bodyStatus})`;
      document.getElementById('resGuaQi').innerText = guaQi;
      document.getElementById('resGuaQi').style.color = wxColors[guaQi] || '#d35400';
      document.getElementById('resNeiXinTi').innerText = neiXinTiName;
      document.getElementById('resNeiXinYong').innerText = neiXinYongName;

      let statusKey = (bodyStatus === "身強") ? "strong" : "weak";

      // --- 統一的體用與卦象網格繪製 ---
      let unifiedGridHTML = `
        <div class="box box-2col">
          <div class="box-title">變卦</div>
          <div class="box-symbol">${hexagramSymbols[bianGuaName]}</div>
          <div class="box-value">${bianGuaName}</div>
          <div class="box-meaning">${hexagramMeanings[bianGuaName] ? hexagramMeanings[bianGuaName][statusKey] : ''}</div>
        </div>
        <div class="box box-2col">
          <div class="box-title">互卦</div>
          <div class="box-symbol">${hexagramSymbols[huGuaName]}</div>
          <div class="box-value">${huGuaName}</div>
          <div class="box-meaning">${hexagramMeanings[huGuaName] ? hexagramMeanings[huGuaName][statusKey] : ''}</div>
        </div>
        <div class="box box-2col">
          <div class="box-title">本卦</div>
          <div class="box-symbol">${hexagramSymbols[benGuaName]}</div>
          <div class="box-value">${benGuaName}</div>
          <div class="box-meaning">${hexagramMeanings[benGuaName] ? hexagramMeanings[benGuaName][statusKey] : ''}</div>
        </div>
      `;

      const gridBottomData = [
        { title: '變', gua: bianTransformed, pos: bianPos, isTi: false, colClass: 'box-2col' },
        { title: '互用', gua: huYongGua, pos: huYongPos, isTi: false, colClass: 'box-1col' },
        { title: '互體', gua: huTiGua, pos: huTiPos, isTi: false, colClass: 'box-1col' },
        { title: '用', gua: yongGua, pos: yongPos, isTi: false, colClass: 'box-1col' },
        { title: '體', gua: tiGua, pos: tiPos, isTi: true, colClass: 'box-1col' }
      ];
      
      let monthIdx = month - 1;
      
      gridBottomData.forEach(item => {
        let rel = getShortRelation(tiGua.wx, item.gua.wx, item.isTi);
        let csKey = getCsKey(item.gua.name, item.pos);
        let csValue = changshengTable[csKey] ? changshengTable[csKey][monthIdx] : "未設";
        
        // 判斷是否要顯示該卦對應的數字 (新增包含"同我")
        let numVal = "&nbsp;"; 
        if (item.isTi || rel.text === "生我" || rel.text === "我剋" || rel.text === "同我") {
            numVal = guaNumbers[item.gua.name] || "&nbsp;";
        }
        
        // 【版面瘦身】已移除原本的 box-rel 與 box-sym
        unifiedGridHTML += `
          <div class="box ${item.colClass}">
            <div class="box-title">${item.title}</div>
            <div class="box-item">${item.gua.name}</div>
            <div class="box-item">${item.gua.wx}</div>
            <div class="box-cs">${csValue}</div>
            <div class="box-num">${numVal}</div>
          </div>
        `;
      });
      document.getElementById('unifiedGuaArea').innerHTML = unifiedGridHTML;

      // --- 五行佈局繪製 ---
      const relObj = {
        tiWx: myWx,
        shengMe: shengMyWx,
        meSheng: shengMap[myWx],
        keMe: Object.keys(keMap).find(k => keMap[k] === myWx),
        meKe: keMap[myWx]
      };

      const circledNum = { '1': '①', '2': '②', '3': '③', '4': '④' };
      
      const buildBox = (wx, labelTop, labelBottom) => {
        let sourcesHTML = '';
        const matches = guaSourcesAll.filter(s => s.tri.wx === wx && s.show);
        matches.forEach((m) => {
           sourcesHTML += `<div class="wx-source-line">${circledNum[m.id]} ${m.tri.name}：${m.hex}</div>`;
        });
        return `
          <div class="wx-item">
            <div class="wx-box wx-color-${wx}">
              <div class="wx-count">${wxCounts[wx] || ''}</div>
              <div class="wx-label-top">${labelTop}</div>
              <span class="wx-char">${wx}</span>
            </div>
            <div class="wx-label-bottom">${labelBottom}</div>
            <div class="wx-sources">${sourcesHTML}</div>
          </div>
        `;
      };

      document.getElementById('wxGridArea').innerHTML = `
        ${buildBox(relObj.shengMe, '生我○', '家庭格')}
        <div></div>
        ${buildBox(relObj.tiWx, '體○', bodyStatus)}
        ${buildBox(relObj.keMe, '剋我╳', '官鬼格')}
        ${buildBox(relObj.meKe, '我剋▲', '妻財格')}
        ${buildBox(relObj.meSheng, '我洩╳', '付出格')}
      `;
    }

    // --- 【升級版】手機/電腦通用的圖片下載與分享功能 ---
    function downloadImage() {
      const captureTarget = document.getElementById('captureTarget');
      const btn = document.getElementById('btnDownload');
      
      const originalText = btn.innerText;
      btn.innerText = "⏳ 圖片產生中...";
      btn.disabled = true;

      html2canvas(captureTarget, {
        scale: window.devicePixelRatio > 1 ? 2 : 1, 
        backgroundColor: '#ffffff',
        useCORS: true
      }).then(canvas => {
        btn.innerText = originalText;
        btn.disabled = false;
        
        const questionText = document.getElementById('question').value.trim();
        const fileName = questionText ? `易經卦象_${questionText}.png` : '易經卦象.png';
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        canvas.toBlob(function(blob) {
          if (navigator.share && isMobile) {
            const file = new File([blob], fileName, { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              navigator.share({
                files: [file],
                title: '易經開卦結果',
                text: questionText ? `測問事項：${questionText}` : '易經開卦結果分享'
              }).catch((error) => {
                console.log('分享取消或失敗，啟用備用方案', error);
                showFallbackModal(canvas.toDataURL('image/png'));
              });
              return; 
            }
          }

          if (!isMobile) {
            const imgData = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = imgData;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          } else {
            showFallbackModal(canvas.toDataURL('image/png'));
          }

        }, 'image/png');

      }).catch(err => {
        btn.innerText = originalText;
        btn.disabled = false;
        console.error("圖片產生失敗", err);
        alert("產生截圖失敗，請稍後再試！\n" + err.message);
      });
    }

    // --- 終極備用方案：顯示全螢幕預覽圖供手機使用者長按儲存 ---
    function showFallbackModal(dataUrl) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      
      const tip = document.createElement('div');
      tip.className = 'modal-tip';
      tip.innerHTML = "請「長按下方圖片」選擇儲存或分享<br><span style='font-size:14px; font-weight:normal; color:#ccc;'>(點擊背景任意處可關閉)</span>";
      
      const img = document.createElement('img');
      img.className = 'modal-img';
      img.src = dataUrl;
      
      overlay.onclick = function() {
        document.body.removeChild(overlay);
      };
      
      img.onclick = function(e) {
        e.stopPropagation();
      };
      
      overlay.appendChild(tip);
      overlay.appendChild(img);
      document.body.appendChild(overlay);
    }
  </script>
